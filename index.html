<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Color Lab</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f4f0;color:#202124;font:17px system-ui,sans-serif}header{background:#202124;color:white;padding:24px 5%;display:flex;justify-content:space-between;align-items:center;gap:20px}h1{margin:0;font-size:32px;letter-spacing:.12em}header p{margin:5px 0;color:#ddd}button,select,input{font:inherit}button,select{border:1px solid #aaa;border-radius:8px;padding:10px 14px;background:white;color:#222;cursor:pointer}button:hover{background:#eee}nav{position:sticky;top:0;background:#fff;z-index:5;padding:12px 4%;display:flex;gap:8px;overflow:auto;border-bottom:1px solid #ddd}nav button{white-space:nowrap}nav button.active{background:#222;color:white}main{max-width:1100px;margin:30px auto;padding:0 22px}section{display:none;background:white;border:1px solid #ddd;border-radius:16px;padding:clamp(18px,4vw,42px)}section.active{display:block}h2{font-size:30px;margin:0 0 10px}p{line-height:1.5} .layout{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center}.controls{display:grid;gap:14px}label{display:block;font-weight:600}input[type=range]{width:100%;accent-color:#333}input[type=color]{width:100%;height:54px;border:0;background:none;cursor:pointer}.swatches{display:flex;gap:6px;margin:15px 0}.swatch{flex:1;min-width:0;text-align:center}.chip{height:85px;border-radius:7px;border:1px solid #0002}.small{font-size:14px;color:#555}.demo{border:1px solid #ddd;border-radius:10px;overflow:hidden}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{height:240px;display:grid;place-items:center}.center{width:34%;aspect-ratio:1}.note{background:#f3f2ee;padding:15px;border-radius:8px}svg{width:100%;max-height:460px;display:block}footer{padding:20px;text-align:center;color:#666;font-size:14px} .palette{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.palette input{height:120px}.palette label{font-size:14px} .pattern{display:grid;grid-template-columns:repeat(8,1fr);height:240px}.pattern div{display:grid;place-items:center}.pattern i{width:55%;aspect-ratio:1;transform:rotate(45deg)}@media(max-width:700px){.layout{grid-template-columns:1fr}.field{height:150px}.palette{grid-template-columns:repeat(3,1fr)}header{align-items:flex-start}h1{font-size:24px}}@media print{nav,header button,.controls button{display:none}section{display:block;break-inside:avoid;margin-bottom:20px}}
</style><header><div><h1>COLOR LAB</h1><p>An interactive exploration of color</p></div><button id="full">Full screen</button></header><nav id="nav"></nav><main id="main"></main><footer>Traditional artist's color relationships · Digital demonstrations are illustrative, not exact pigment simulations.</footer><script>
const C=['#F4D82C','#F4AE29','#EE7925','#E94C29','#D92F3D','#B32E70','#773E9F','#4845A9','#286DC1','#21999D','#4A9F48','#9BC438'],N=['Yellow','Yellow-orange','Orange','Red-orange','Red','Red-violet','Violet','Blue-violet','Blue','Blue-green','Green','Yellow-green'];
const $=id=>document.getElementById(id), tabs=['Color wheel','Color properties','Tints & shades','Contrast','Bezold effect','Temperature','Mixing','Palette builder','Composition'];
const select=(id,items)=>`<select id="${id}">${items.map((x,i)=>`<option value="${i}">${x}</option>`).join('')}</select>`;const range=(id,min,max,v)=>`<input type="range" id="${id}" min="${min}" max="${max}" value="${v}">`;const color=(id,v)=>`<input type="color" id="${id}" value="${v}">`;const sw=(a,n=[])=>`<div class="swatches">${a.map((c,i)=>`<div class="swatch"><div class="chip" style="background:${c}"></div><div class="small">${n[i]||c}</div></div>`).join('')}</div>`;
const mix=(a,b,t)=>'#'+[1,3,5].map(i=>Math.round(parseInt(a.slice(i,i+2),16)*(1-t)+parseInt(b.slice(i,i+2),16)*t).toString(16).padStart(2,'0')).join('');
const sections=[`<h2>Color wheel & harmony</h2><p>Explore relationships on the traditional red–yellow–blue artist's wheel.</p><div class="layout"><div id="wheel"></div><div class="controls"><label>Starting hue ${select('hue',N)}</label><label>Color scheme ${select('scheme',['All colors','Complementary','Analogous','Split-complementary','Triadic','Monochromatic'])}</label><div id="schemeInfo"></div><div id="wheelSw"></div><button id="wheelReset">Reset wheel</button></div></div><p class="note">Primary: red, yellow, blue. Secondary: orange, green, violet. Tertiary: the six intermediate hues. Opposite colors are complementary.</p>`,
`<h2>Hue, value & saturation</h2><p>Change one property at a time. Observe how the color responds.</p><div class="layout"><div id="hslPatch" class="demo" style="height:330px"></div><div class="controls"><label>Hue <span id="hv"></span>${range('h',0,360,210)}</label><label>Lightness <span id="lv"></span>${range('l',0,100,50)}</label><label>Saturation <span id="sv"></span>${range('s',0,100,80)}</label><button id="hslReset">Reset</button></div></div><div id="hslSw"></div><p class="note">Hue is the color family. Value is perceived lightness or darkness. Saturation describes vividness. HSL lightness is a digital approximation, not a measurement of perceived artistic value.</p>`,
`<h2>Tints, tones & shades</h2><p>Compare a hue mixed digitally with white, gray, and black.</p><label>Base color ${color('base','#286dc1')}</label><label>Amount added <span id="amountV"></span>${range('amount',0,100,45)}</label><div id="tts"></div><button id="ttsReset">Reset</button>`,
`<h2>Simultaneous contrast</h2><p>The center squares are identical. Change their surroundings and observe how different they appear.</p><div class="pair"><div class="field" id="fieldA"><div class="center" id="centerA"></div></div><div class="field" id="fieldB"><div class="center" id="centerB"></div></div></div><div class="layout"><label>Left background ${color('bgA','#222222')}</label><label>Right background ${color('bgB','#eeeeee')}</label></div><label>Identical center color ${color('centerColor','#64a9a0')}</label><button id="contrastReset">Reset</button>`,
`<h2>Bezold effect</h2><p>Change only the background of the left pattern. All repeated shapes remain identical.</p><div class="pair"><div class="pattern" id="patA"></div><div class="pattern" id="patB"></div></div><div class="layout"><label>Left pattern background ${color('bezA','#d34839')}</label><label>Right pattern background ${color('bezB','#dedede')}</label></div><button id="bezReset">Reset</button><p class="note">Notice changes in perceived energy, unity, and emphasis even though the repeated motifs have not changed.</p>`,
`<h2>Warm & cool colors</h2><p>Compare temperature and the apparent depth of shapes. Warm colors often advance and cool colors often recede, depending on context.</p><div id="tempSw"></div><div class="demo"><svg viewBox="0 0 600 280"><rect id="tempBg" width="600" height="280" fill="#b4b4b4"/><circle id="tempLeft" cx="210" cy="140" r="85" fill="#e87531"/><circle id="tempRight" cx="390" cy="140" r="85" fill="#3674cb"/></svg></div><div class="layout"><label>Left color ${color('warm','#e87531')}</label><label>Right color ${color('cool','#3674cb')}</label></div><label>Background ${color('tempBack','#b4b4b4')}</label><button id="tempReset">Reset</button>`,
`<h2>Color mixing</h2><p>Compare traditional artist's mixing relationships with digital RGB interpolation.</p><div class="layout"><div><h3>Traditional RYB</h3><label>Primary 1 ${select('p1',['Red','Yellow','Blue'])}</label><label>Primary 2 ${select('p2',['Red','Yellow','Blue'])}</label><div id="ryb"></div><p class="small">Illustrative primary and secondary relationships. Actual pigment mixtures depend on pigment and medium.</p></div><div><h3>Digital mixing</h3><label>Color A ${color('mixA','#e83b32')}</label><label>Color B ${color('mixB','#3474cb')}</label><label>Blend ${range('blend',0,100,50)}</label><div id="rgb"></div><p class="small">RGB channel interpolation, not physical paint mixing or additive light superposition.</p></div></div><button id="mixReset">Reset</button>`,
`<h2>Palette builder</h2><p>Choose five colors for a working palette. Adjust each swatch and copy its hexadecimal values.</p><div class="palette" id="palette"></div><div id="paletteStrip"></div><button id="copy">Copy palette</button> <button id="palReset">Reset</button><p id="copyStatus" role="status"></p>`,
`<h2>Color & composition</h2><p>Explore how color proportion, placement, and contrast affect balance and emphasis.</p><div class="layout"><div class="demo"><svg viewBox="0 0 500 350"><rect id="compBase" width="500" height="350"/><rect id="compSupport" width="175" height="350"/><rect id="compAccent" x="170" y="70" width="70" height="210"/><circle id="compNeutral" cx="395" cy="85" r="32"/></svg></div><div class="controls"><label>Dominant ${color('dom','#254d73')}</label><label>Supporting ${color('sup','#7599b3')}</label><label>Accent ${color('acc','#d78c43')}</label><label>Neutral ${color('neu','#e4d9c7')}</label><label>Dominant background proportion <span id="propV"></span>${range('prop',10,90,65)}</label><label>Supporting shape height <span id="supportHeightV"></span>${range('supportHeight',40,350,350)}</label><label>Accent width <span id="accentWidthV"></span>${range('accentSize',15,250,70)}</label><label>Accent height <span id="accentHeightV"></span>${range('accentHeight',20,330,210)}</label><label>Neutral circle diameter <span id="neutralSizeV"></span>${range('neutralSize',10,240,64)}</label><button id="compReset">Reset</button></div></div><p class="note">A small area of contrasting color can have substantial visual weight. Change the size of each shape to see how proportion affects visual balance and emphasis.</p>`];
$('nav').innerHTML=tabs.map((t,i)=>`<button data-tab="${i}">${t}</button>`).join('');$('main').innerHTML=sections.map((s,i)=>`<section id="tab${i}">${s}</section>`).join('');function tab(i){document.querySelectorAll('section').forEach((s,j)=>s.classList.toggle('active',i===j));document.querySelectorAll('nav button').forEach((s,j)=>s.classList.toggle('active',i===j))}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>tab(+b.dataset.tab));tab(0);
function bind(ids,fn){ids.forEach(id=>$(id).addEventListener('input',fn));fn()}function reset(id,values,fn){$(id).onclick=()=>{Object.entries(values).forEach(([k,v])=>$(k).value=v);fn()}}function wheel(){let b=+$('hue').value,s=+$('scheme').value,idx=(s===0?Array.from({length:12},(_,i)=>i):s===1?[b,b+6]:s===2?[b-1,b,b+1]:s===3?[b,b+5,b+7]:s===4?[b,b+4,b+8]:[b]).map(i=>(i+12)%12);let pt=(i,r)=>[180+r*Math.cos((i*30-90)*Math.PI/180),180+r*Math.sin((i*30-90)*Math.PI/180)];$('wheel').innerHTML=`<svg viewBox="0 0 360 360">${C.map((c,i)=>{let a=pt(i-.5,130),z=pt(i+.5,130),p=pt(i,151);return `<path d="M180 180 L${a} A130 130 0 0 1 ${z} Z" fill="${c}" opacity="${idx.includes(i)?1:.2}" stroke="white" stroke-width="2" data-hue="${i}" style="cursor:pointer"/><text x="${p[0]}" y="${p[1]+4}" text-anchor="middle" font-size="11">${['Y','YO','O','RO','R','RV','V','BV','B','BG','G','YG'][i]}</text>`}).join('')}<circle cx="180" cy="180" r="43" fill="white"/>${s>0&&idx.length>1?`<polygon points="${idx.map(i=>pt(i,88).join(',')).join(' ')}" fill="none" stroke="#222" stroke-width="3"/>`:''}<text x="180" y="184" text-anchor="middle" font-size="12">RYB</text></svg>`;$('wheel').querySelectorAll('path').forEach(p=>p.onclick=()=>{$('hue').value=p.dataset.hue;wheel()});$('schemeInfo').textContent=['Select a scheme to highlight its relationships.','Opposite hues create contrast.','Neighboring hues create unity.','A hue and the two neighbors of its complement.','Three equally spaced hues.','Variations of one hue.'][s];$('wheelSw').innerHTML=s===0?'':s===5?sw([mix(C[b],'#ffffff',.7),C[b],mix(C[b],'#000000',.5)],['Tint','Hue','Shade']):sw(idx.map(i=>C[i]),idx.map(i=>N[i]))}bind(['hue','scheme'],wheel);reset('wheelReset',{hue:8,scheme:0},wheel);$('hue').value=8;wheel();
function hsl(){let h=+$('h').value,l=+$('l').value,s=+$('s').value; $('hv').textContent=h+'°';$('lv').textContent=l+'%';$('sv').textContent=s+'%';$('hslPatch').style.background=`hsl(${h},${s}%,${l}%)`;$('hslSw').innerHTML=sw([`hsl(${h},${s}%,20%)`,`hsl(${h},${s}%,50%)`,`hsl(${h},${s}%,80%)`],['Dark','Middle','Light'])}bind(['h','l','s'],hsl);reset('hslReset',{h:210,l:50,s:80},hsl);
function tts(){let c=$('base').value,t=$('amount').value/100;$('amountV').textContent=Math.round(t*100)+'%';$('tts').innerHTML=sw([mix(c,'#ffffff',t),c,mix(c,'#808080',t),mix(c,'#000000',t)],['Tint','Base hue','Tone','Shade'])}bind(['base','amount'],tts);reset('ttsReset',{base:'#286dc1',amount:45},tts);
function contrast(){['A','B'].forEach(k=>{$('field'+k).style.background=$('bg'+k).value;$('center'+k).style.background=$('centerColor').value})}bind(['bgA','bgB','centerColor'],contrast);reset('contrastReset',{bgA:'#222222',bgB:'#eeeeee',centerColor:'#64a9a0'},contrast);
function bez(){['A','B'].forEach(k=>{$('pat'+k).style.background=$('bez'+k).value;$('pat'+k).innerHTML=Array.from({length:32},(_,i)=>`<div><i style="background:${['#e9b93d','#284c73','#f08b42','#333333'][i%4]}"></i></div>`).join('')})}bind(['bezA','bezB'],bez);reset('bezReset',{bezA:'#d34839',bezB:'#dedede'},bez);
$('tempSw').innerHTML=sw(['#d83a36','#ee8728','#f2d23a','#399b72','#3674cb','#794ca2'],['Warm','Warm','Warm','Cool','Cool','Cool']);function temp(){[['tempLeft','warm'],['tempRight','cool'],['tempBg','tempBack']].forEach(([a,b])=>$(a).setAttribute('fill',$(b).value))}bind(['warm','cool','tempBack'],temp);reset('tempReset',{warm:'#e87531',cool:'#3674cb',tempBack:'#b4b4b4'},temp);
function mixing(){let a=+$('p1').value,b=+$('p2').value,p=[C[4],C[0],C[8]],n=['Red','Yellow','Blue'],key=[a,b].sort().join(''),out=a===b?[p[a],n[a]]:key==='01'?[C[2],'Orange']:key==='02'?[C[6],'Violet']:[C[10],'Green'];$('ryb').innerHTML=sw([p[a],p[b],out[0]],[n[a],n[b],out[1]]);let x=$('mixA').value,y=$('mixB').value;$('rgb').innerHTML=sw([x,mix(x,y,$('blend').value/100),y],['A','Blend','B'])}bind(['p1','p2','mixA','mixB','blend'],mixing);reset('mixReset',{p1:0,p2:1,mixA:'#e83b32',mixB:'#3474cb',blend:50},mixing);$('p2').value=1;mixing();
let defaults=['#254d73','#7599b3','#d78c43','#e4d9c7','#333333'];$('palette').innerHTML=defaults.map((c,i)=>`<label>${['Dominant','Supporting','Accent','Neutral','Extra'][i]}${color('pal'+i,c)}</label>`).join('');let palIds=defaults.map((_,i)=>'pal'+i);function palette(){$('paletteStrip').innerHTML=sw(palIds.map(i=>$(i).value))}bind(palIds,palette);reset('palReset',Object.fromEntries(palIds.map((id,i)=>[id,defaults[i]])),palette);$('copy').onclick=async()=>{let t=palIds.map(i=>$(i).value).join(', ');try{await navigator.clipboard.writeText(t);$('copyStatus').textContent='Copied: '+t}catch(e){$('copyStatus').textContent='Copy these values: '+t}};
function comp(){
 [['compBase','dom'],['compSupport','sup'],['compAccent','acc'],['compNeutral','neu']].forEach(([a,b])=>$(a).setAttribute('fill',$(b).value));
 const w=500*(100-Number($('prop').value))/100;
 const supportH=Number($('supportHeight').value);
 const accentW=Number($('accentSize').value);
 const accentH=Number($('accentHeight').value);
 const diameter=Number($('neutralSize').value);
 $('compSupport').setAttribute('width',w);
 $('compSupport').setAttribute('height',supportH);
 $('compAccent').setAttribute('width',accentW);
 $('compAccent').setAttribute('height',accentH);
 $('compAccent').setAttribute('x',Math.max(0,Math.min(500-accentW,w-15)));
 $('compAccent').setAttribute('y',Math.max(0,(350-accentH)/2));
 $('compNeutral').setAttribute('r',diameter/2);
 $('compNeutral').setAttribute('cx',Math.max(diameter/2,Math.min(500-diameter/2,395)));
 $('compNeutral').setAttribute('cy',Math.max(diameter/2,Math.min(350-diameter/2,85)));
 $('propV').textContent=$('prop').value+'%';
 $('supportHeightV').textContent=supportH;
 $('accentWidthV').textContent=accentW;
 $('accentHeightV').textContent=accentH;
 $('neutralSizeV').textContent=diameter;
}
bind(['dom','sup','acc','neu','prop','supportHeight','accentSize','accentHeight','neutralSize'],comp);
reset('compReset',{dom:'#254d73',sup:'#7599b3',acc:'#d78c43',neu:'#e4d9c7',prop:65,supportHeight:350,accentSize:70,accentHeight:210,neutralSize:64},comp);
$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){alert('Use your browser’s full-screen command (F11 on many computers).')}};document.addEventListener('fullscreenchange',()=>{$('full').textContent=document.fullscreenElement?'Exit full screen':'Full screen'});
</script></html>
